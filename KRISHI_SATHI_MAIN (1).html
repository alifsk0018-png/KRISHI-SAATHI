<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRISHI SAATHI— Smart Farm, Market & Procurement Assistant</title>
<meta name="description" content="Farmer-first SIH26032 platform for procurement, markets, weather, crop care, AI assistance and farm profit tracking.">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F4D3A">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kisan Saathi">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./debug.js"></script>
<style>
  :root{
    --forest:#1F4D3A;
    --forest-light:#2E6B4F;
    --forest-dark:#153627;
    --marigold:#E8A33D;
    --marigold-dark:#C9832A;
    --gold-light:#F5C563;
    --paper:#F7F2E5;
    --card:#FFFDF8;
    --clay:#B5442E;
    --clay-light:#F3D9D1;
    --sky:#5C93B8;
    --sky-light:#DCEAF2;
    --leaf-light:#DCEBD9;
    --ink:#1E2B1F;
    --ink-soft:#5B6A5C;
    --ink-faint:#8A9689;
    --line:#E5DBC3;
    --font-display:'Baloo 2','Noto Sans Devanagari',system-ui,sans-serif;
    --font-body:'Inter','Noto Sans Devanagari',system-ui,sans-serif;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--paper);
    background-image:repeating-linear-gradient(115deg, rgba(31,77,58,0.05) 0px, rgba(31,77,58,0.05) 2px, transparent 2px, transparent 30px);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
  }
  .stage{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }
  .phone{
    position:relative;
    width:390px;
    height:844px;
    max-height:94vh;
    background:#0E1611;
    border-radius:48px;
    padding:14px;
    box-shadow:0 40px 80px -20px rgba(20,40,25,0.45), 0 10px 30px -10px rgba(20,40,25,0.3);
    display:flex;
    flex-direction:column;
  }
  .phone-inner{
    position:relative;
    flex:1;
    background:var(--paper);
    border-radius:34px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .notch{
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%);
    width:120px; height:26px;
    background:#0E1611;
    border-radius:16px;
    z-index:50;
  }
  .statusbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 26px 4px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    flex-shrink:0;
    z-index:20;
    position:relative;
    background:transparent;
  }
  .statusbar .icons{display:flex; align-items:center; gap:5px;}
  .screen{
    flex:1;
    overflow-y:auto;
    padding:6px 18px 18px;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none;}
  .screen--flush{padding:0; overflow:hidden; display:flex; flex-direction:column;}
  .screen.enter{ animation:fadeSlide .32s ease; }
  @keyframes fadeSlide{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- Typography ---------- */
  h1,h2,h3,.display{ font-family:var(--font-display); color:var(--ink); margin:0; }
  h1{font-size:26px; font-weight:700;}
  h2{font-size:20px; font-weight:700;}
  h3{font-size:16px; font-weight:600;}
  p{margin:0; line-height:1.5;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint); font-size:12px;}

  /* ---------- Buttons & inputs ---------- */
  .btn{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    border:none;
    border-radius:14px;
    padding:14px 20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:focus-visible{ outline:3px solid var(--sky); outline-offset:2px; }
  .btn-primary{ background:var(--forest); color:#fff; box-shadow:0 8px 18px -6px rgba(31,77,58,0.55); }
  .btn-primary:hover{ background:var(--forest-light); }
  .btn-block{ width:100%; }
  .btn-ghost{ background:transparent; color:var(--forest); border:1.5px solid var(--line); }
  .btn-ghost:hover{ background:var(--leaf-light); }
  .btn-marigold{ background:var(--marigold); color:#3A2A0E; box-shadow:0 8px 18px -6px rgba(232,163,61,0.55);}
  .btn-sm{ padding:9px 14px; font-size:13px; border-radius:11px; }
  .btn-icon{ background:var(--leaf-light); color:var(--forest); border-radius:50%; width:44px; height:44px; padding:0; flex-shrink:0; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; font-family:var(--font-display); }
  .input, select.input{
    width:100%;
    font-family:var(--font-body);
    font-size:15px;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink);
  }
  .input:focus, select.input:focus{ outline:none; border-color:var(--marigold); box-shadow:0 0 0 3px rgba(232,163,61,0.25); }
  .input::placeholder{ color:var(--ink-faint); }

  /* ---------- Cards ---------- */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:16px;
  }
  .section-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .link-btn{ background:none; border:none; color:var(--forest); font-family:var(--font-display); font-weight:600; font-size:13px; cursor:pointer; padding:4px; display:flex; align-items:center; gap:2px; }

  /* ---------- Language screen ---------- */
  .lang-screen{ padding-top:38px; }
  .brand{ text-align:center; margin-bottom:30px; }
  .brand .logo-mark{
    width:74px; height:74px; margin:0 auto 14px;
    background:linear-gradient(160deg, var(--forest) 0%, var(--forest-light) 55%, var(--marigold) 130%);
    border-radius:22px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px -8px rgba(31,77,58,0.5);
  }
  .lang-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px; }
  .lang-btn{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    font-family:var(--font-display);
  }
  .lang-btn:active{ transform:scale(0.97); }
  .lang-btn .native{ font-size:19px; font-weight:700; color:var(--ink); display:block; }
  .lang-btn .eng{ font-size:11px; color:var(--ink-faint); display:block; margin-top:2px; font-family:var(--font-body); }
  .lang-btn.ready{ border-color:var(--forest); background:var(--leaf-light); }

  /* ---------- Home hero ---------- */
  .home-hero{
    margin:0 -18px 6px;
    padding:20px 18px 26px;
    background:linear-gradient(150deg, var(--forest-dark) 0%, var(--forest) 55%, var(--marigold-dark) 145%);
    border-radius:0 0 26px 26px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .home-hero::after{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(120deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1.5px, transparent 1.5px, transparent 22px);
    pointer-events:none;
  }
  .home-hero-top{ display:flex; align-items:flex-start; justify-content:space-between; position:relative; z-index:2;}
  .home-hero h1{ color:#fff; font-size:23px; }
  .home-hero .loc{ color:rgba(255,255,255,0.8); font-size:13px; margin-top:4px; display:flex; align-items:center; gap:5px;}
  .bell-btn{ position:relative; background:rgba(255,255,255,0.16); border:none; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; }
  .bell-dot{ position:absolute; top:8px; right:9px; width:9px; height:9px; background:var(--clay); border-radius:50%; border:2px solid var(--forest-dark); }
  .weather-mini{
    margin-top:18px;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    position:relative; z-index:2;
    cursor:pointer;
  }
  .weather-mini .temp{ font-family:var(--font-display); font-size:30px; font-weight:700; color:#fff; }
  .weather-mini .txt{ flex:1; }
  .weather-mini .txt strong{ display:block; font-family:var(--font-display); font-size:14px; margin-bottom:2px;}
  .weather-mini .txt span{ font-size:12.5px; color:rgba(255,255,255,0.85); }

  /* ---------- Feature grid ---------- */
  .feature-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .feature-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:118px;
  }
  .feature-card:active{ transform:scale(0.97); }
  .feature-card .ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .feature-card h3{ font-size:14.5px; }
  .feature-card p{ font-size:12px; color:var(--ink-soft); line-height:1.4; }
  .feature-card.wide{ grid-column:1 / -1; flex-direction:row; align-items:center; min-height:auto; }
  .feature-card.wide .ic{ flex-shrink:0; }

  /* ---------- Chips / tags ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    padding:9px 15px;
    border-radius:100px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .chip.active{ background:var(--forest); border-color:var(--forest); color:#fff; }
  .badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; }
  .badge-clay{ background:var(--clay-light); color:var(--clay); }
  .badge-leaf{ background:var(--leaf-light); color:var(--forest); }
  .badge-gold{ background:#FCEBC8; color:var(--marigold-dark); }

  /* ---------- Header with back ---------- */
  .subhead{ display:flex; align-items:center; gap:10px; padding:14px 0 6px; }
  .subhead h2{ flex:1; }

  /* ---------- Weather screen ---------- */
  .weather-hero{
    background:linear-gradient(160deg, var(--sky) 0%, #6FA3C4 100%);
    border-radius:20px;
    padding:22px 20px;
    color:#fff;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .weather-hero .big-temp{ font-family:var(--font-display); font-size:56px; font-weight:700; line-height:1; margin:6px 0; }
  .weather-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .weather-stats .st{ background:rgba(255,255,255,0.18); border-radius:12px; padding:9px 6px; }
  .weather-stats .st .val{ font-family:var(--font-display); font-size:15px; font-weight:700; }
  .weather-stats .st .lab{ font-size:10.5px; color:rgba(255,255,255,0.85); margin-top:1px; }

  .forecast-strip{ display:flex; gap:10px; overflow-x:auto; padding:4px 2px 6px; scrollbar-width:none; }
  .forecast-strip::-webkit-scrollbar{ display:none; }
  .fday{ flex-shrink:0; width:64px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 6px; text-align:center; }
  .fday.today{ border-color:var(--forest); background:var(--leaf-light); }
  .fday .d{ font-family:var(--font-display); font-weight:700; font-size:13px; }
  .fday .temps{ font-size:11.5px; margin-top:6px; color:var(--ink-soft); }
  .fday .temps b{ color:var(--ink); }

  .advice-card{ border-radius:18px; padding:16px; margin-top:16px; border:1.5px solid; }
  .advice-card.warn{ background:var(--clay-light); border-color:#E3B8A9; }
  .advice-card.good{ background:var(--leaf-light); border-color:#B9D8B3; }
  .advice-card .adv-top{ display:flex; gap:12px; align-items:flex-start; }
  .adv-icon{ width:42px; height:42px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .why-toggle{ margin-top:10px; background:none; border:none; padding:0; color:var(--forest); font-family:var(--font-display); font-weight:600; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .why-box{ margin-top:8px; font-size:13px; color:var(--ink-soft); background:rgba(255,255,255,0.55); border-radius:10px; padding:10px 12px; line-height:1.5; }

  /* ---------- Market screen ---------- */
  .crop-select-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
  .crop-select-row::-webkit-scrollbar{ display:none; }
  .crop-pill{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 14px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; min-width:64px; }
  .crop-pill.active{ border-color:var(--marigold); background:#FCEBC8; }
  .crop-pill .em{ font-size:22px; }
  .crop-pill .nm{ font-size:11.5px; font-weight:600; font-family:var(--font-display); }

  .chart-card{ margin-top:6px; }
  .chart-row{ display:flex; align-items:flex-end; gap:14px; height:150px; margin:18px 4px 6px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar-val{ font-family:var(--font-display); font-weight:700; font-size:12px; margin-bottom:6px; color:var(--ink); }
  .bar{ width:100%; max-width:38px; border-radius:8px 8px 4px 4px; background:var(--leaf-light); transition:height .5s ease; }
  .bar.best{ background:linear-gradient(180deg, var(--marigold), var(--marigold-dark)); }
  .bar-name{ font-size:10.5px; color:var(--ink-soft); margin-top:8px; text-align:center; line-height:1.25; }
  .bar-name b{ display:block; color:var(--ink); font-weight:600; }

  .trend-row{ display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .trend-up{ color:#3E8E5C; font-weight:700; }
  .trend-down{ color:var(--clay); font-weight:700; }

  /* ---------- Checklist ---------- */
  .progress-wrap{ display:flex; align-items:center; gap:10px; margin:12px 0 18px; }
  .progress-track{ flex:1; height:8px; background:var(--line); border-radius:100px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--forest); border-radius:100px; transition:width .4s ease; }
  .progress-num{ font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--forest); flex-shrink:0; }

  .task-item{ display:flex; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); }
  .task-item:last-child{ border-bottom:none; }
  .task-num{ font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--ink-faint); width:22px; flex-shrink:0; padding-top:2px; }
  .checkbox{
    width:24px; height:24px; border-radius:7px; border:2px solid var(--line);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:var(--card); margin-top:1px;
  }
  .checkbox.done{ background:var(--forest); border-color:var(--forest); }
  .task-body{ flex:1; cursor:pointer; }
  .task-body.done p.title{ text-decoration:line-through; color:var(--ink-faint); }
  .task-body p.title{ font-weight:600; font-size:14.5px; margin-bottom:3px; }
  .task-body .reason{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  /* ---------- Ask Saathi ---------- */
  .saathi-header{ padding:16px 18px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .saathi-avatar{ width:38px; height:38px; border-radius:50%; background:linear-gradient(160deg, var(--forest), var(--marigold)); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .chat-log{ flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; scrollbar-width:none; }
  .chat-log::-webkit-scrollbar{ display:none; }
  .bubble{ max-width:80%; padding:11px 14px; border-radius:16px; font-size:13.5px; line-height:1.5; }
  .bubble.saathi{ background:var(--leaf-light); color:var(--ink); border-bottom-left-radius:4px; align-self:flex-start; }
  .bubble.user{ background:var(--forest); color:#fff; border-bottom-right-radius:4px; align-self:flex-end; }
  .suggest-wrap{ padding:0 18px 10px; flex-shrink:0; }
  .listening-row{ display:flex; align-items:center; gap:8px; align-self:flex-start; background:var(--card); border:1px solid var(--line); padding:10px 14px; border-radius:16px; font-size:13px; color:var(--ink-soft); }
  .dot-pulse{ display:flex; gap:3px; }
  .dot-pulse span{ width:6px; height:6px; border-radius:50%; background:var(--marigold); animation:pulse 1s infinite ease-in-out; }
  .dot-pulse span:nth-child(2){ animation-delay:.15s; }
  .dot-pulse span:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{ 0%,80%,100%{ opacity:.3; transform:scale(0.8);} 40%{ opacity:1; transform:scale(1);} }
  .chat-input-bar{ display:flex; align-items:center; gap:8px; padding:12px 14px; border-top:1px solid var(--line); background:var(--card); flex-shrink:0; }
  .chat-input-bar input{ flex:1; border:1.5px solid var(--line); border-radius:100px; padding:11px 16px; font-family:var(--font-body); font-size:14px; background:var(--paper); }
  .chat-input-bar input:focus{ outline:none; border-color:var(--marigold); }
  .mic-btn{ width:42px; height:42px; border-radius:50%; border:none; background:var(--marigold); color:#3A2A0E; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .mic-btn.active{ background:var(--clay); color:#fff; animation:micpulse 1s infinite; }
  @keyframes micpulse{ 0%{ box-shadow:0 0 0 0 rgba(181,68,46,0.5);} 70%{ box-shadow:0 0 0 10px rgba(181,68,46,0);} 100%{ box-shadow:0 0 0 0 rgba(181,68,46,0);} }
  .send-btn{ width:42px; height:42px; border-radius:50%; border:none; background:var(--forest); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }

  /* ---------- Alerts ---------- */
  .alert-card{ display:flex; gap:12px; padding:14px; border-radius:16px; border:1px solid var(--line); background:var(--card); margin-bottom:12px; }
  .alert-ic{ width:40px; height:40px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .alert-card .time{ font-size:11px; color:var(--ink-faint); margin-top:4px; display:block; }

  /* ---------- Profile ---------- */
  .profile-hero{ text-align:center; padding:20px 0 10px; }
  .avatar-big{ width:76px; height:76px; border-radius:50%; margin:0 auto 12px; background:linear-gradient(160deg, var(--forest), var(--marigold)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-size:28px; font-weight:700; }
  .info-row{ display:flex; justify-content:space-between; align-items:center; padding:13px 2px; border-bottom:1px solid var(--line); }
  .info-row:last-child{ border-bottom:none; }
  .info-row .lab{ font-size:13px; color:var(--ink-soft); }
  .info-row .val{ font-size:14px; font-weight:600; text-align:right; }
  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .tag-pill{ background:var(--leaf-light); color:var(--forest); font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:100px; }

  /* ---------- Procurement screen ---------- */

.sih-impact-stats div{padding:8px;border-radius:11px;background:rgba(255,255,255,.1);text-align:center}.sih-impact-stats b{display:block;font-size:15px}.sih-impact-stats span{font-size:7.5px;color:#dcebe0}
@media(max-width:600px){.sih-requirement-grid{grid-template-columns:1fr}.sih-impact-stats{grid-template-columns:repeat(3,1fr)}}
.solution-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.solution-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;background:#edf7ef;color:#2f7a4a;font-size:9px;font-weight:800}.solution-chip.muted{background:#f4f5f1;color:#78847b}.solution-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.solution-detail{padding:10px;border:1px solid #e7ede7;border-radius:12px;background:#fbfdfb}.solution-detail span{display:block;font-size:8px;color:#7a897e;text-transform:uppercase;letter-spacing:.05em}.solution-detail b{display:block;font-size:12px;margin-top:3px;color:var(--ink)}.solution-status-list{display:grid;gap:6px;margin-top:10px}.solution-status-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf1ed;font-size:10px}.solution-status-row:last-child{border-bottom:0}.solution-status-row b{color:#2f7a4a}.solution-status-row.pending b{color:#a87528}.solution-admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.solution-admin-grid div{padding:10px;border-radius:12px;background:#f5f8f4;border:1px solid #e5ece5}.solution-admin-grid b{display:block;font-size:17px;color:var(--forest)}.solution-admin-grid span{display:block;font-size:8px;color:#758279;margin-top:3px}.solution-alert{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff8e9;border:1px solid #efdfbd;color:#755d2d;font-size:10px;line-height:1.4}@media(max-width:600px){.solution-detail-grid,.solution-admin-grid{grid-template-columns:1fr 1fr}}

/* Front-page splash adapted from the supplied Kisan Saathi version */
#introOverlay{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease-out}
.intro-content{text-align:center;animation:introSlideUp .8s ease-out forwards;padding:24px}

.intro-logo svg{width:52px;height:52px;stroke-width:1.8}.intro-content h1{font-family:var(--font-display);font-size:34px;color:var(--forest);margin:0}.intro-content p{color:var(--ink-soft);font-size:15px;margin:7px 0 0}.growth-line{width:0;height:4px;background:var(--marigold);margin:22px auto 0;border-radius:4px;animation:introGrowLine 1s .2s forwards ease-in-out}.intro-caption{margin-top:22px;font-size:11px;color:var(--ink-faint)}
@keyframes introSlideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes introGrowLine{to{width:150px}}

/* ---------- Bottom nav ---------- */
  .bottomnav{

  }

/* ===== REQUESTED NAVIGATION GROUPING ONLY ===== */
.bottomnav.ks-grouped-nav{

  justify-content:center;
  overflow-x:auto;
}
.bottomnav.ks-grouped-nav::before{content:none;}
.ks-nav-brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
  padding:0 22px 0 10px;
  margin-right:2px;
  color:var(--forest);
  white-space:nowrap;
}
.ks-nav-brand-logo{width:40px;height:40px;display:grid;place-items:center;color:var(--forest);}
.ks-nav-brand-logo svg{width:38px;height:38px;stroke-width:1.75;}
.ks-nav-brand b{font-family:var(--font-display);font-size:20px;font-weight:800;}
.ks-nav-group{
  display:flex;

.ks-nav-group .navitem.active{background:#e7f2e9;}

.ks-nav-scan{

.ks-nav-scan:hover{background:var(--forest-light);}
.ks-nav-scan svg{width:20px;height:20px;stroke-width:2.05;}
.ks-nav-single{flex:0 0 auto;}

/* =========================================================
   KISAN SAATHI — MOBILE-FIRST NAV + 3D REALISM UPGRADE
   ========================================================= */

/* Language page: deeper 3D cards after the intro animation */
.lang-screen{
  position:relative;
  perspective:1000px;
  padding-bottom:28px;
}
.lang-screen::before,
.lang-screen::after{
  content:"";
  position:absolute;
  width:150px;height:150px;border-radius:50%;
  pointer-events:none;
  filter:blur(2px);
  opacity:.22;
  z-index:0;
}
.lang-screen::before{
  left:-90px;top:70px;
  background:radial-gradient(circle,#E8A33D 0%,transparent 68%);
  animation:ksOrbFloat 5s ease-in-out infinite;
}
.lang-screen::after{
  right:-90px;bottom:80px;
  background:radial-gradient(circle,#2E6B4F 0%,transparent 68%);
  animation:ksOrbFloat 6s .7s ease-in-out infinite reverse;
}
.lang-screen > *{position:relative;z-index:1}
.lang-screen .brand .logo-mark{
  transform:translateZ(20px);
  box-shadow:0 18px 32px rgba(31,77,58,.25), inset 0 2px 0 rgba(255,255,255,.22);
  animation:ksLogoFloat 3.4s ease-in-out infinite;
}
.lang-grid{
  perspective:900px;
}
.lang-btn{
  position:relative;
  overflow:hidden;
  transform:translateZ(0);
  box-shadow:0 7px 14px rgba(31,77,58,.07), inset 0 1px 0 rgba(255,255,255,.85);
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.lang-btn::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.42),transparent 45%);
  pointer-events:none;
}
.lang-btn:hover{
  transform:translateY(-4px) rotateX(2deg) rotateY(-2deg);
  box-shadow:0 15px 25px rgba(31,77,58,.14);
}
.lang-btn.ready{
  box-shadow:0 8px 18px rgba(31,77,58,.10), inset 0 1px 0 rgba(255,255,255,.75);
}
@keyframes ksLogoFloat{
  0%,100%{transform:translateY(0) rotateX(0deg) rotateY(0deg)}
  50%{transform:translateY(-5px) rotateX(2deg) rotateY(-2deg)}
}
@keyframes ksOrbFloat{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(12px,-10px,0) scale(1.08)}
}

/* Existing realistic landing gets stronger depth */
.ks-real-scene{
  transform-style:preserve-3d;
  box-shadow:0 28px 70px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.12);
}
.ks-real-farmer{
  transform-style:preserve-3d;
}
.ks-tractor{

}
.ks-floating-card,
.ks-profit-card{

}
.feature-card,.card,.proc-card,.centre-card,.status-board,.sih-req-card{
  box-shadow:0 8px 20px rgba(31,77,58,.06), inset 0 1px 0 rgba(255,255,255,.75);
}

/* Mobile navigation: exact requested order
   Home | Procurement+Market | BIG Crop Scanner | Weather+Crop Care | Profile */
@media (max-width:600px){
  .phone-inner{
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }

  .screen{
    padding-bottom:100px;
  }

  .bottomnav.ks-grouped-nav{
    position:relative;
    display:grid;
    grid-template-columns:minmax(42px,.9fr) minmax(76px,1.55fr) 72px minmax(76px,1.55fr) minmax(42px,.9fr);
    align-items:end;
    gap:3px;
    height:78px;
    padding:7px 7px calc(env(safe-area-inset-bottom,0px) + 7px);

    box-shadow:0 -12px 30px rgba(31,77,58,.12);
    backdrop-filter:blur(20px) saturate(1.15);

    z-index:100;
  }

  .ks-grouped-nav .ks-nav-brand{

  }

  .ks-grouped-nav > .navitem,
  .ks-grouped-nav > .ks-nav-group,
  .ks-grouped-nav > .ks-nav-single{
    min-width:0;
  }

  /* Hide legacy extras so Profile is genuinely last */
  .ks-grouped-nav > .ks-nav-single:nth-last-of-type(3),
  .ks-grouped-nav > .ks-nav-single:nth-last-of-type(2){
    display:none !important;
  }

  .ks-grouped-nav > .ks-nav-single:last-child{
    display:block !important;
    grid-column:5;
  }

  /* Home is first */
  .ks-grouped-nav > .navitem{
    grid-column:1;
  }

  /* Procurement + Market are second zone */
  .ks-grouped-nav > .ks-nav-group:nth-of-type(1){
    grid-column:2;
  }

  /* Central scanner */
  .ks-grouped-nav > .ks-nav-scan{
    grid-column:3;
    align-self:start;
    justify-self:center;

    min-width:68px;

    padding:0;
    border-radius:50%;
    border:4px solid var(--card);
    background:linear-gradient(145deg,#F5C563 0%,#E8A33D 48%,#C9832A 100%);
    color:#3A2A0E;

    flex-direction:column;
    justify-content:center;

    transform:translateZ(0);
    transition:transform .18s ease, box-shadow .18s ease;

  .ks-grouped-nav > .ks-nav-scan:active{

  }
  .ks-grouped-nav > .ks-nav-scan .ks-scan-icon{
    width:31px;height:31px;
    display:grid;place-items:center;
    margin-bottom:1px;
  }
  .ks-grouped-nav > .ks-nav-scan .ks-scan-icon svg{
    width:31px;height:31px;
    stroke-width:2.3;
  }
  .ks-grouped-nav > .ks-nav-scan > span:last-child{
    display:block;
    font-family:var(--font-display);
    font-size:8px;
    line-height:1;
    font-weight:800;
    white-space:nowrap;
  }

  /* Weather + Crop Care fourth zone */
  .ks-grouped-nav > .ks-nav-group:nth-of-type(2){

  }

  .ks-grouped-nav .ks-nav-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px;
    padding:0;
    min-width:0;
  }
  .ks-grouped-nav .ks-nav-group .navitem{
    min-width:0;
    width:100%;
    height:58px;
    padding:5px 2px;
    border-radius:13px;

  }
  .ks-grouped-nav .navitem{
    min-width:0;
    height:58px;
    padding:5px 2px;
    border-radius:13px;
    gap:1px;
  }
  .ks-grouped-nav .navitem span:last-child{

  }
  .ks-grouped-nav .ks-nav-icon svg{

    padding:5px 2px;
    border-radius:13px;

  /* Better mobile touch spacing */

  }

  /* Keep floating Saathi above the page, but out of the bottom-nav hit area */
  .ks-floating-saathi{

const MARKET_DEMO_PRICES = {onion:1850,tomato:1400,cotton:6900,soybean:4700,wheat:2450};
const MARKET_PRICE_OFFSETS = [0,-55,-110,-165];
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function nearestWbMarkets(){
  if(!state.location || !Number.isFinite(state.location.lat)) return WB_MARKETS.slice(0,4).map((m,i)=>({...m,distance:null,price:MARKET_DEMO_PRICES[state.selectedMarketCrop]+MARKET_PRICE_OFFSETS[i],best:i===0}));
  return WB_MARKETS.map(m=>({...m,distance:haversineKm(state.location.lat,state.location.lon,m.lat,m.lon)}))
    .sort((a,b)=>a.distance-b.distance).slice(0,4)
    .map((m,i)=>({...m,price:MARKET_DEMO_PRICES[state.selectedMarketCrop]+MARKET_PRICE_OFFSETS[i],best:i===0}));
}
function mandiDataForCrop(cropId){
  const markets=nearestWbMarkets();
  return {change:6, mandis:markets};
}

function fmtDay(offset, lang){
  const d = new Date(); d.setDate(d.getDate()+offset);
  const arr = lang==='hi' ? WEEKDAYS_HI : WEEKDAYS_EN;
  return arr[d.getDay()];
}
function cropLabel(crop, lang){
  const c = CROPS_LIST.find(c=>c.id===crop);

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 3400);
}

  if([71,73,75,77,85,86].includes(code)) return {icon:'🌨️',en:'Snow'};
  return {icon:'🌦️',en:'Mixed conditions'};
}

async function loadLiveWeather(force=false){
  if(!state.location || !Number.isFinite(Number(state.location.lat)) || !Number.isFinite(Number(state.location.lon))) return;
  const key=`${Number(state.location.lat).toFixed(3)},${Number(state.location.lon).toFixed(3)}`;
  if(!force && state.weather.status==='ready' && state.weather.locationKey===key && state.weather.updatedAt && Date.now()-state.weather.updatedAt<10*60*1000) return;
  state.weather={status:'loading',data:null,error:'',locationKey:key,updatedAt:null}; render();
  try{
    const lat=Number(state.location.lat), lon=Number(state.location.lon);
    const url='https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lon)+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,uv_index&hourly=precipitation_probability,temperature_2m,weather_code,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max&forecast_days=7&timezone=auto';
    const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok) throw new Error('weather http '+r.status);
    const j=await r.json();
    if(!j.current || !j.daily) throw new Error('invalid weather response');
    const now=new Date(); const h=j.hourly||{}; let rain6=0;
    if(Array.isArray(h.time)&&Array.isArray(h.precipitation_probability)){
      const idx=Math.max(0,h.time.findIndex(x=>new Date(x)>=now));
      rain6=Math.max(...h.precipitation_probability.slice(idx<0?0:idx,(idx<0?0:idx)+6).map(Number).filter(Number.isFinite),0);
    }
    state.weather={status:'ready',locationKey:key,updatedAt:Date.now(),error:'',data:{current:{temp:j.current.temperature_2m,feel:j.current.apparent_temperature,humidity:j.current.relative_humidity_2m,precip:j.current.precipitation,code:j.current.weather_code,wind:j.current.wind_speed_10m,windDir:j.current.wind_direction_10m,uv:j.current.uv_index},hourly:{rain6},daily:{time:j.daily.time||[],hi:j.daily.temperature_2m_max||[],lo:j.daily.temperature_2m_min||[],code:j.daily.weather_code||[],rain:j.daily.precipitation_sum||[],rainMax:j.daily.precipitation_probability_max||[],uv:j.daily.uv_index_max||[]}}};
    try{localStorage.setItem('ks_live_weather',JSON.stringify(state.weather));}catch(e){}
    render();
  }catch(e){
    console.error('Live weather error',e); state.weather={status:'error',locationKey:key,error:String(e?.message||e),data:null,updatedAt:null}; render();
  }
}

function genericHealthResult(crop,symptom){

  const x=map[symptom]||['No confident diagnosis from the current image',45,'A single photo is not enough to distinguish several look-alike crop problems.'];
  return {disease:x[0],confidence:x[1],why:`${x[2]} Crop: ${name}.`,do:['Take 2–3 clear photos in daylight: whole plant, affected leaf and close-up.','Check the underside of leaves and the stem/root zone if possible.','Confirm the diagnosis with a local agriculture officer or KVK before chemical treatment.'],dont:['Do not mix pesticides or change doses without label or expert confirmation.','Do not spray a chemical just because the leaf colour changed.'],severity:'moderate'};
}

    floating.innerHTML=`<span class="ks-saathi-float-icon ks-saathi-logo">${saathiAvatar(50)}<span class="ks-saathi-logo-wave">${ic('mic',11)}</span></span><span class="ks-saathi-float-copy"><strong>${esc(t('saathi'))}</strong><small>AI Voice Assistant</small></span><span class="ks-saathi-float-move">↕</span>`;
    document.body.appendChild(floating);
    floating.addEventListener('click',()=>{
      if(window.__ksDraggedSaathi){ window.__ksDraggedSaathi=false; return; }
      go('saathi');
    });
    let dragging=false,startX=0,startY=0,startLeft=0,startTop=0,moved=false;
    const start=(e)=>{
      const pt=e.touches?e.touches[0]:e;
      dragging=true;moved=false;startX=pt.clientX;startY=pt.clientY;
      const r=floating.getBoundingClientRect();startLeft=r.left;startTop=r.top;
      floating.style.right='auto';floating.style.bottom='auto';floating.style.left=startLeft+'px';floating.style.top=startTop+'px';
      if(e.cancelable)e.preventDefault();
    };
    const move=(e)=>{
      if(!dragging)return;
      const pt=e.touches?e.touches[0]:e;
      const dx=pt.clientX-startX,dy=pt.clientY-startY;
      if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
      floating.style.left=Math.max(8,Math.min(window.innerWidth-floating.offsetWidth-8,startLeft+dx))+'px';
      floating.style.top=Math.max(76,Math.min(window.innerHeight-floating.offsetHeight-8,startTop+dy))+'px';
      if(e.cancelable)e.preventDefault();
    };
    const end=()=>{dragging=false;if(moved)window.__ksDraggedSaathi=true;};
    floating.addEventListener('mousedown',start);
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',end);
    floating.addEventListener('touchstart',start,{passive:false});
    window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('touchend',end);
  }
}

    bindFile('scannerCamera'); bindFile('scannerGallery');
  }

function handleScannerFile(file){
  if(!file||!file.type.startsWith('image/')){showToast(xt('imageType'));return;}
  if(file.size>8*1024*1024){showToast(xt('imageSize'));return;}
  const reader=new FileReader(); reader.onload=()=>{state.scanner.imageData=String(reader.result);state.scanner.fileName=file.name;state.scanner.result=null;render();analyzeScanner();}; reader.onerror=()=>showToast(xt('imageReadError')); reader.readAsDataURL(file);
}
async function analyzeScanner(){
  if(!state.scanner.imageData){showToast(xt('photoFirst'));return;}
  state.scanner.crop=document.getElementById('scannerCrop')?.value||state.scanner.crop||state.farmer.crop||'rice';
  state.scanner.symptom=state.scanner.symptom||scannerSymptoms()[0]?.[0]||'brown';
  state.scanner.loading=true; state.scanner.result=null; render();
  const endpoint=window.KS_CROP_AI_ENDPOINT||'';
  if(endpoint){
    try{
      const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),12000);
      const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop:state.scanner.crop,symptom:state.scanner.symptom,image:state.scanner.imageData,language:state.lang}),signal:controller.signal}); clearTimeout(timer);
      if(r.ok){const data=await r.json(); if(data&&data.disease){state.scanner.result={disease:String(data.disease),confidence:Number(data.confidence||70),why:String(data.why||'Vision model result.'),do:Array.isArray(data.do)?data.do:[],dont:Array.isArray(data.dont)?data.dont:[]}; state.scanner.loading=false;render();return;}}
    }catch(e){}
  }
  // Offline/demo fallback: symptom-aware expert rules. This keeps the feature usable without exposing an AI API key in the browser.
  await new Promise(r=>setTimeout(r,900));
  state.scanner.result=getScannerResult(state.scanner.crop,state.scanner.symptom); state.scanner.loading=false; render();
}

function handleAction(action, arg, el){
  switch(action){
    case 'enter-app': go('lang'); break;
    case 'demo-app': go('lang'); break;
    case 'hisab-expense': { const item=document.getElementById('hisabExpenseItem')?.value.trim(); const amount=Number(document.getElementById('hisabExpenseAmount')?.value); if(!item||!amount||amount<0){showToast('Enter expense item and amount');break;} const r=loadHisab(); r.push({type:'expense',item,amount,date:new Date().toLocaleDateString('en-IN')}); saveHisab(r); showToast('Expense added'); render(); break; }
    case 'hisab-sale': { const item=document.getElementById('hisabSaleItem')?.value.trim(); const amount=Number(document.getElementById('hisabSaleAmount')?.value); if(!item||!amount||amount<0){showToast('Enter sale item and amount');break;} const r=loadHisab(); r.push({type:'sale',item,amount,date:new Date().toLocaleDateString('en-IN')}); saveHisab(r); showToast('Sale added'); render(); break; }
    case 'hisab-clear': saveHisab([]); showToast('Farm records cleared'); render(); break;
    case 'set-lang':
      state.lang = arg;
      document.documentElement.lang = arg;
      if(state.screen==='lang') go('login'); else render();
      break;
    case 'lang-soon':
      state.lang = arg;
      document.documentElement.lang = arg;
      go('login');
      break;
    case 'nav':
      go(arg);
      break;
    case 'proc-scroll': { const target=document.getElementById(arg); if(target){target.scrollIntoView({behavior:'smooth',block:'start'});} break; }
    case 'proc-advance':
      state.procurement.stage=Math.min(4,(state.procurement.stage||1)+1);
      if(state.procurement.stage>=4) state.procurement.payment='PROCESSING';
      showToast(state.procurement.stage>=4?'Produce accepted · payment tracking enabled':'Procurement status advanced for demo');
      go('procurement');
      break;
    case 'proc-select-slot':
      state.procurement.slot = arg;
      showToast('Slot selected · '+arg+' · confirm to book');
      render();
      break;
    case 'proc-refresh-queue': {
      const delta = Math.floor(Math.random()*7)-3;
      state.procurement.queue = Math.max(0, state.procurement.queue + delta);
      state.procurement.queueUpdatedAt = Date.now();
      showToast('Live queue refreshed · '+state.procurement.queue+' farmers ahead');
      render();
      break;
    }
    case 'proc-send-notification': {
      state.procurement.notificationsSent = (state.procurement.notificationsSent||0) + 1;
      const msg = state.procurement.booked
        ? 'Demo SMS/App/WhatsApp/IVR alert sent · '+state.procurement.centre+' · Token '+state.procurement.token
        : 'Demo multi-channel alert queued · book a procurement slot to personalise it';
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification('Kisan Saathi · Procurement', {body:msg}); }catch(e){}
      }
      showToast(msg);
      render();
      break;
    }
    case 'proc-waitlist':
      showToast('You are on the controlled waitlist · an unused slot will be released fairly');
      break;
    case 'proc-reschedule':
      state.procurement.booked=false;
      state.procurement.stage=0;
      showToast('Slot released · choose a new date and time');
      render();
      break;
    case 'proc-recommend-centre':
      state.procurement.centre='Gopalpur Collection Hub';
      state.procurement.queue=9;
      state.procurement.queueUpdatedAt=Date.now();
      showToast('Nearby lower-wait centre suggested · Gopalpur Collection Hub');
      render();
      break;
    case 'proc-complaint':
      showToast('Demo complaint created · reference '+state.procurement.token);
      break;
    case 'msp-calc': {
      const crop=document.getElementById('mspCrop')?.value || state.farmer.crop || 'rice';
      const qty=Number(document.getElementById('mspQty')?.value || 0);
      if(!qty || qty<=0){showToast('Enter a valid quantity in quintals');break;}
      state.farmer.crop=crop; state.procurement.crop=crop; state.procurement.quantity=qty;
      try{localStorage.setItem('ks_farmer',JSON.stringify(state.farmer));}catch(e){}
      showToast('MSP earnings preview updated');
      render();
      break;
    }
    case 'proc-book':
      state.procurement.booked=true;
      state.procurement.registrationComplete=!!state.farmer.name;
      state.procurement.token='A-'+Math.floor(100+Math.random()*899);
      state.procurement.queue=Math.max(4,state.procurement.queue-2);

async function getLocationPermissionState(){
  try{
    if(!navigator.permissions?.query) return 'unknown';
    const p=await navigator.permissions.query({name:'geolocation'});
    return p.state;
  }catch(e){ return 'unknown'; }
}

function locationErrorMessage(error){
  // 1 = permission denied, 2 = position unavailable, 3 = timeout.
  if(error?.code===1) return t('locationDeniedShort');
  if(error?.code===2) return 'Your device could not determine a GPS position. Turn on Location/GPS and try again.';
  if(error?.code===3) return 'GPS took too long to respond. Move outdoors or near a window and try again.';
  return t('locationDeniedShort');
}

async function refreshDevicePermissions(){
  const d=state.device||{};
  d.gps=await getLocationPermissionState();
  try{ d.mic=navigator.permissions?.query ? (await navigator.permissions.query({name:'microphone'})).state : ('SpeechRecognition' in window||'webkitSpeechRecognition' in window)?'unknown':'unsupported'; }catch(e){ d.mic=('SpeechRecognition' in window||'webkitSpeechRecognition' in window)?'unknown':'unsupported'; }
  d.camera=('mediaDevices' in navigator && !!navigator.mediaDevices?.getUserMedia)?'supported':'unsupported';
  state.device=d;
  render();
}
async function requestMicPermission(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){showToast('Microphone permission is not available in this browser. You can still type to Saathi.');return;}
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    state.device=state.device||{}; state.device.mic='granted'; render(); showToast('Microphone ready. Open Saathi and tap the microphone.');
  }catch(e){
    state.device=state.device||{}; state.device.mic=e?.name==='NotAllowedError'?'denied':'unknown'; render();
    showToast('Microphone access was blocked. Allow Microphone in browser Site settings, then try again.');
  }
}

async function requestFarmerLocation(){
  if(!window.isSecureContext && !/^https?:\/\/localhost(?::\d+)?/.test(location.href) && !/^https?:\/\/127\.0\.0\.1(?::\d+)?/.test(location.href)){
    state.locationStatus='denied';
    state.locationSource='gps';
    showToast('GPS needs a secure HTTPS website. Deploy Kisan Saathi on Netlify/Vercel or use localhost for testing.');
    render();
    return;
  }
  if(!navigator.geolocation){
    state.locationStatus='denied';
    showToast(t('locationNotSupported'));
    render();
    return;
  }

  const permission=await getLocationPermissionState();
  if(permission==='denied'){
    state.locationStatus='denied';
    state.locationSource='gps';
    showToast('GPS is blocked for this site. Allow Location in Chrome Site settings, then tap Allow GPS again.');
    render();
    return;
  }

  state.locationStatus='loading';
  state.locationSource='gps';
  render();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude, lon=pos.coords.longitude;
    let name='Current location';
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=10&addressdetails=1&accept-language=en`,{headers:{'Accept':'application/json'}});
      if(r.ok){
        const j=await r.json();
        name=j.address?.village||j.address?.town||j.address?.city||j.address?.municipality||j.address?.county||j.display_name?.split(',')[0]||'Current location';
      }
    }catch(e){}
    state.location={lat,lon,name,accuracy:Math.round(pos.coords.accuracy||0)};
    state.locationStatus='ready';
    state.locationSource='gps';
    try{localStorage.setItem('ks_location',JSON.stringify(state.location)); localStorage.setItem('ks_location_source','gps');}catch(e){}
    render();
    showToast(`GPS location detected: ${name}`);
  },async error=>{
    if(error?.code===1){
      state.locationStatus='denied';
      state.locationSource='gps';
      showToast('GPS permission was denied. Use Chrome Site settings → Location → Allow, then try again.');
    } else {
      state.locationStatus='denied';
      showToast(locationErrorMessage(error));
    }
    render();
  },{enableHighAccuracy:true,timeout:25000,maximumAge:60000});
}

async function requestApproxLocation(){
  state.locationStatus='loading';
  state.locationSource='approx';
  render();
  try{
    const r=await fetch('https://ipapi.co/json/',{headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('approx location failed');
    const j=await r.json();
    const lat=Number(j.latitude), lon=Number(j.longitude);
    if(!Number.isFinite(lat)||!Number.isFinite(lon)) throw new Error('invalid coordinates');
    const name=j.city || j.region || j.country_name || 'Approximate location';
    state.location={lat,lon,name,accuracy:null};
    state.locationStatus='ready';
    state.locationSource='approx';
    try{localStorage.setItem('ks_location',JSON.stringify(state.location)); localStorage.setItem('ks_location_source','approx');}catch(e){}
    render();
    showToast(`Approximate location detected: ${name}. Turn on GPS for precise results.`);
  }catch(e){
    state.locationStatus='denied';
    showToast('Approximate location could not be detected. Please allow GPS or enter your location manually.');
    render();
  }
}

function restoreSavedLocation(){

      state.locationSource=localStorage.getItem('ks_location_source')||'gps';
    }
  }catch(e){}
}

function speakSaathi(text){
  if(!('speechSynthesis' in window)){showToast('Voice output is not supported in this browser.');return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=getSpeechLang(); u.rate=.94; u.pitch=1;
  const voices=window.speechSynthesis.getVoices();
  const preferred=voices.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase()) || voices.find(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));
  if(preferred) u.voice=preferred;
  window.speechSynthesis.speak(u);
}

function startSaathiVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Voice input is not supported. Try Chrome on Android or desktop.');return;}
  if(window.__saathiRecognition){try{window.__saathiRecognition.stop();}catch(e){}}
  const rec=new SR();
  window.__saathiRecognition=rec;
  rec.lang=getSpeechLang(); rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
  state.chat.listening=true; state.chat.voiceDraft=''; render();
  rec.onresult=(event)=>{
    let finalText='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const part=event.results[i][0]?.transcript||'';
      if(event.results[i].isFinal) finalText+=part; else state.chat.voiceDraft=part;
    }
    if(finalText.trim()){state.chat.voiceDraft=''; state.chat.listening=false; pushChat(finalText.trim());}
  };
  rec.onerror=(event)=>{
    state.chat.listening=false; state.chat.voiceDraft=''; render();
    const msg={notallowed:'Microphone permission is blocked. Allow microphone access in Chrome Site settings.','audio-capture':'No microphone was found. Check your device microphone.',network:'Voice recognition needs a network connection in this browser.'}[event.error];
    showToast(msg||'Voice input stopped. Please try again.');
  };
  rec.onend=()=>{state.chat.listening=false;state.chat.voiceDraft='';if(state.screen==='saathi')render();};
  try{rec.start();}catch(e){state.chat.listening=false;render();showToast('Could not start the microphone. Try again.');}
}

async function getRemoteSaathiReply(message){
  const endpoint=window.KS_AI_ENDPOINT;
  if(!endpoint) return null;
  try{
    const context={
      language:state.lang,
      crop:state.farmer.crop,
      village:state.farmer.village,
      quantity:state.procurement.quantity,
      procurement:{centre:state.procurement.centre,queue:state.procurement.queue,token:state.procurement.token,stage:state.procurement.stage,payment:state.procurement.payment},
      location:state.location?{name:state.location.name,lat:state.location.lat,lon:state.location.lon}:null
    };
    const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),9000);
    const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,language:state.lang,context}),signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok) return null;
    const data=await r.json();
    const reply=data.reply||data.message||data.text||data.output?.text;
    return typeof reply==='string'&&reply.trim()?reply.trim():null;
  }catch(e){return null;}
}

function pushChat(text){
  if(!text||!String(text).trim()) return;
  const clean=String(text).trim();
  state.chat.messages.push({from:'user', text:clean});
  state.chat.thinking=true; state.chat.listening=false;
  render();
  Promise.resolve(getRemoteSaathiReply(clean)).then(reply=>reply||computeSaathiReply(clean)).then(reply=>{
    state.chat.thinking=false;
    state.chat.messages.push({from:'saathi',text:reply});
    render();
    setTimeout(()=>speakSaathi(reply),80);
  }).catch(()=>{
    const reply=computeSaathiReply(clean); state.chat.thinking=false; state.chat.messages.push({from:'saathi',text:reply}); render();
  });
}

    potato:{en:'For potato, avoid waterlogging, maintain uniform moisture during tuber development and watch for late blight symptoms after humid weather.',hi:'आलू में जलभराव से बचें, कंद बनने के समय समान नमी रखें और नम मौसम के बाद झुलसा रोग के लक्षण देखें।',bn:'আলুতে জলাবদ্ধতা এড়ান, কন্দ গঠনের সময় সমান আর্দ্রতা রাখুন এবং স্যাঁতসেঁতে আবহাওয়ার পরে ধসা রোগের লক্ষণ দেখুন।'}

  const fallbackAdvice={en:`For ${cropName}, monitor soil moisture, weeds and common pests regularly. For a pesticide or fertiliser decision, confirm the product and dose with your local agriculture officer or label before applying.`,hi:`${cropName} के लिए मिट्टी की नमी, खरपतवार और सामान्य कीटों की नियमित निगरानी करें। कीटनाशक या उर्वरक की मात्रा तय करने से पहले स्थानीय कृषि अधिकारी या उत्पाद के लेबल की पुष्टि करें।`,bn:`${cropName}-এর জন্য মাটির আর্দ্রতা, আগাছা ও সাধারণ পোকার নিয়মিত নজরদারি করুন। কীটনাশক বা সারের মাত্রা ব্যবহারের আগে স্থানীয় কৃষি আধিকারিক বা পণ্যের লেবেল দেখে নিশ্চিত করুন।`};

  if(has(['hello','hi ','namaste','নমস্কার','হ্যালো','नमस्ते','start'])) return localized({en:`Namaste! I am Saathi. I can help with ${cropName}, procurement slots, queue status, MSP preview, weather guidance, market information and farm profit.` ,hi:`नमस्ते! मैं साथी हूँ। मैं ${cropName}, खरीद स्लॉट, कतार, MSP अनुमान, मौसम, बाजार और खेत के हिसाब में मदद कर सकता हूँ।`,bn:`নমস্কার! আমি সাথী। ${cropName}, ক্রয় স্লট, সারি, MSP অনুমান, আবহাওয়া, বাজার ও কৃষি হিসাব নিয়ে সাহায্য করতে পারি।`});

  if(has(['procurement','procure','schedule','slot','queue','waiting','token','खरीद','समय','टोकन','ক্রয়','ক্ৰয়','খরিদ'])) return localized({en:`Your demo procurement centre is ${state.procurement.centre}. Current queue: ${state.procurement.queue} farmers ahead, estimated wait about 45 minutes. Token: ${state.procurement.token}. Open Procurement to book or change a slot.`,hi:`आपका डेमो खरीद केंद्र ${state.procurement.centre} है। अभी ${state.procurement.queue} किसान आगे हैं और अनुमानित प्रतीक्षा लगभग 45 मिनट है। आपका टोकन ${state.procurement.token} है। स्लॉट बदलने के लिए Procurement खोलें।`,bn:`আপনার ডেমো ক্রয় কেন্দ্র ${state.procurement.centre}। এখন ${state.procurement.queue} জন কৃষক সামনে এবং আনুমানিক অপেক্ষা ৪৫ মিনিট। আপনার টোকেন ${state.procurement.token}। স্লট বদলাতে Procurement খুলুন।`});

  if(has(['weather','rain','irrigat','water','बारिश','मौसम','सেচ','পানি','বৃষ্টি','वर्षा'])) return localized({en:'The demo weather panel currently shows light clouds and a heavy-rain risk for tomorrow evening. If heavy rain is expected, avoid unnecessary irrigation and check field drainage. Use the Weather screen for the latest available data.',hi:'डेमो मौसम पैनल में हल्के बादल और कल शाम भारी बारिश का जोखिम दिखाया गया है। भारी बारिश की संभावना हो तो अनावश्यक सिंचाई न करें और खेत की निकासी जांचें। नवीनतम उपलब्ध जानकारी के लिए Weather स्क्रीन देखें।',bn:'ডেমো আবহাওয়া প্যানেলে হালকা মেঘ ও আগামীকাল সন্ধ্যায় ভারী বৃষ্টির ঝুঁকি দেখানো হয়েছে। ভারী বৃষ্টি হলে অপ্রয়োজনীয় সেচ এড়ান এবং জমির জলনিকাশি পরীক্ষা করুন। সর্বশেষ তথ্যের জন্য Weather স্ক্রিন দেখুন।'});
  if(has(['pest','insect','disease','कीट','रोग','পোকা','রোগ','থ্রিপ'])) return localized({en:`For ${cropName}, inspect leaves and stems before spraying. If you see silvery streaks, curling, holes or unusual spots, take a clear photo and confirm the diagnosis with a local agriculture expert before applying chemicals.`,hi:`${cropName} में छिड़काव से पहले पत्तियों और तनों की जांच करें। चांदी जैसी धारियां, मुड़ना, छेद या असामान्य दाग दिखें तो साफ फोटो लेकर स्थानीय कृषि विशेषज्ञ से पुष्टि करें।`,bn:`${cropName}-এ স্প্রে করার আগে পাতা ও কাণ্ড পরীক্ষা করুন। রূপালি দাগ, পাতা কুঁকড়ানো, ছিদ্র বা অস্বাভাবিক দাগ থাকলে পরিষ্কার ছবি নিয়ে স্থানীয় কৃষি বিশেষজ্ঞের পরামর্শ নিন।`});
  if(has(['fertil','fertilizer','urea','nitrogen','khad','খাদ','সার','खाद','उर्वरक'])) return localized({en:`For ${cropName}, use fertiliser based on soil test and the crop's recommended dose. Do not add extra nitrogen just because the crop looks pale; confirm the cause first.`,hi:`${cropName} में मिट्टी जांच और फसल की अनुशंसित मात्रा के आधार पर उर्वरक दें। केवल फसल पीली दिखने पर अतिरिक्त नाइट्रोजन न डालें; पहले कारण की पुष्टि करें।`,bn:`${cropName}-এ মাটি পরীক্ষার ফল ও ফসলের সুপারিশ অনুযায়ী সার দিন। শুধু ফসল ফ্যাকাশে দেখালেই অতিরিক্ত নাইট্রোজেন দেবেন না; আগে কারণ নিশ্চিত করুন।`});
  if(has(['gps','location','nearby','centre','center','स्थान','लोकेशन','অবস্থান','কেন্দ্র'])) return localized({en:`You can use the GPS button to find nearby procurement centres. If Chrome has blocked location, open Site settings → Location → Allow, reload the site, and tap Allow GPS again. Approximate location is available as a demo fallback.`,hi:`नजदीकी खरीद केंद्र खोजने के लिए GPS बटन दबाएं। अगर Chrome ने लोकेशन ब्लॉक की है तो Site settings → Location → Allow करें, साइट रीलोड करें और फिर Allow GPS दबाएं। डेमो में अनुमानित लोकेशन भी उपलब्ध है।`,bn:`কাছের ক্রয় কেন্দ্র খুঁজতে GPS বোতাম চাপুন। Chrome যদি লোকেশন ব্লক করে থাকে, Site settings → Location → Allow করুন, সাইট রিলোড করে আবার Allow GPS চাপুন। ডেমোর জন্য আনুমানিক অবস্থানও ব্যবহার করা যাবে।`});
  if(has(['profit','hisab','expense','cost','লাভ','খরচ','मुनाफा','खर्च'])) return localized({en:'Open Krishi Hisab to record seed, fertiliser, labour, transport and sales. It calculates your farm income and profit from the entries you provide.',hi:'Krishi Hisab खोलकर बीज, उर्वरक, मजदूरी, परिवहन और बिक्री दर्ज करें। आपके दिए रिकॉर्ड से आय और लाभ की गणना होगी।',bn:'Krishi Hisab খুলে বীজ, সার, শ্রম, পরিবহন ও বিক্রির হিসাব লিখুন। আপনার দেওয়া তথ্য থেকে আয় ও লাভ হিসাব হবে।'});
  if(has(['crop','rice','paddy','jute','wheat','maize','potato','mustard','onion','tomato','ধান','চাল','পাট','গম','আলু','পেঁয়াজ','ফসল'])) return cropText;
  return localized({en:`I can help with your ${cropName} and the Kisan Saathi services. Try asking “When should I go to procurement?”, “How much will I earn?”, “How do I use GPS?”, or “What should I do about pests?”`,hi:`मैं आपकी ${cropName} और Kisan Saathi सेवाओं में मदद कर सकता हूँ। पूछें: “खरीद केंद्र कब जाऊं?”, “मैं कितना कमाऊंगा?”, “GPS कैसे चलाएं?” या “कीटों के लिए क्या करूं?”`,bn:`আমি আপনার ${cropName} এবং Kisan Saathi পরিষেবা নিয়ে সাহায্য করতে পারি। জিজ্ঞাসা করুন: “ক্রয় কেন্দ্রে কখন যাব?”, “আমি কত আয় করব?”, “GPS কীভাবে চালাব?” বা “পোকার জন্য কী করব?”`});
}

/* ============ EVENT WIRING ============ */
document.addEventListener('click', function(e){
  const target = e.target.closest('[data-action]');
  if(!target) return;
  handleAction(target.dataset.action, target.dataset.arg, target);
});

document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.activeElement?.id==='chatInput' && !e.shiftKey){e.preventDefault();doSendChat();}
});

/* ============ STATUS BAR CLOCK ============ */
function updateClock(){
  const d = new Date();
  let h = d.getHours(); const min = d.getMinutes();
  const ampm = h>=12 ? 'PM':'AM';
  h = h % 12; if(h===0) h = 12;
  document.getElementById('statusTime').textContent = `${h}:${String(min).padStart(2,'0')} ${ampm}`;
}
updateClock();
setInterval(updateClock, 15000);

/* ============ PWA: INSTALL PROMPT ============ */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  window.__deferredPrompt = e;
  state.installAvailable = true;
  if(state.screen === 'profile') render();
});
window.addEventListener('appinstalled', () => {
  window.__deferredPrompt = null;
  state.installAvailable = false;
  showToast(t('installedToast'));
  if(state.screen === 'profile') render();
});

/* ============ PWA: SERVICE WORKER ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* ============ SAATHI AI CONFIG ============ */
// Optional production AI endpoint. Keep API keys on your server, never in this HTML.
// Example: window.KS_AI_ENDPOINT = 'https://your-domain.example/api/saathi';
window.KS_AI_ENDPOINT = window.KS_AI_ENDPOINT || '';
// Optional secure backend for real plant-vision diagnosis. Never put a provider secret in this file.
window.KS_CROP_AI_ENDPOINT = window.KS_CROP_AI_ENDPOINT || '';

/* ============ INIT ============ */
const introOverlay=document.getElementById('introOverlay');
if(introOverlay){
  const introSeen=sessionStorage.getItem('ks_intro_played');
  if(introSeen){introOverlay.style.display='none';}
  else{setTimeout(()=>{introOverlay.style.opacity='0';setTimeout(()=>{introOverlay.style.display='none';sessionStorage.setItem('ks_intro_played','true');},500);},1800);}
}
initFirebaseAuth();
restoreSavedLocation();
render();
setTimeout(()=>refreshDevicePermissions(),250);
</script>
